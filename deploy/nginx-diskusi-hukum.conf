# Nginx config untuk deploy Diskusi Hukum di VPS Legion (203.145.35.68)
# Path: /etc/nginx/sites-available/diskusi-hukum
# - App jalan di /diskusi-hukum/ (reverse proxy ke Next.js port 3000)
# - Path tanpa prefix (/artikel, /admin, dll) auto-redirect ke /diskusi-hukum/...
# - /api/, /_next/, /images/ di-proxy ke app
# - / = landing page daftar website

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect halaman app tanpa prefix -> /diskusi-hukum/
    location ~ ^/(admin|artikel|tentang|agenda|kontributor|konsultasi|premium|login|usulkan-topik|pedoman-editorial|kontak|cari)(/|$) {
        return 301 :///diskusi-hukum;
    }

    # API Diskusi Hukum
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
    }

    # Asset Next.js
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
    }

    # Gambar statis
    location /images/ {
        alias /var/www/diskusi-hukum/public/images/;
        expires 30d;
    }

    # Diskusi Hukum - Next.js app (STRIP prefix)
    location /diskusi-hukum/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }

    # Exact /diskusi-hukum -> redirect ke slash
    location = /diskusi-hukum {
        return 301 :///diskusi-hukum/;
    }

    # Default: landing page
    location / {
        root /var/www/landing;
        index index.html;
        try_files  / =404;
    }
}
